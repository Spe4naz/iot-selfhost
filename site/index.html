      body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 20px; background: #0f1220; color: #e6e9f2; }

  <body>
    <main>
      <h1>IoT Modular System</h1>
      <p>Это самосдостируемый инстанс. Данная страница — только заглушка, чтобы
      nginx умел раздавать интерфейс и файлы прошивок.</p>
      <p class="ok">API: <code>/api/v1/health</code> &nbsp;·&nbsp; OTA: <code>/fw/</code></p>
      <p>
        API-документация: <code>GET /api/v1/health</code>, устройства
        <code>/api/v1/devices</code> (требует <code>Authorization: Bearer &lt;token&gt;</code>).
      </p>
    </main>
