# IoT Modular System — mosquitto configuration (self-hosted).
# Listener 1883 : plain MQTT for devices.
# Listener 9001 : WebSockets for the Flutter app.
# TLS-terminated WebSocket (9002) is intentionally not included: publicly the
# stack is exposed through nginx + Let's Encrypt; MQTT-WS stays on 9001 plain
# (same as the production VPS). For fully private networks use TLS or a VPN.

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stderr

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

max_connections 32
message_size_limit 1048576